[project]
name = "label-doc-sync"
version = "0.1.0"
description = "Sync CONTRIBUTING.md label tables with live GitHub labels"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Open Source Contributor", email = "contrib@example.com" }]
keywords = ["github", "labels", "contributing", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.license]
file = "LICENSE"

[project.scripts]
label-doc-sync = "labeldocsync.cli:main"

[project.urls]
Repository = "https://github.com/ScobieWorks/label-doc-sync"

[tool]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.setuptools]

[tool.setuptools.packages]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
